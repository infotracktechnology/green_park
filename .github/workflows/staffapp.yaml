name: 📱 StaffApp Android Build

on:
  push:
    branches:
      - main
    paths:
      - 'gpstaffapp/**'
      - '.github/workflows/staffapp.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'gpstaffapp/**'
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter 3.19.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

      - name: 📦 Install dependencies
        working-directory: gpstaffapp
        run: flutter pub get

      - name: 🩺 Analyze (non-blocking)
        working-directory: gpstaffapp
        run: flutter analyze || true

      - name: 🔑 Restore release keystore
        working-directory: gpstaffapp
        env:
          KEYSTORE_BASE64: ${{ secrets.STAFFAPP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/jsastute-release.keystore
            echo "Keystore restored ✅"
          else
            echo "⚠️ STAFFAPP_KEYSTORE_BASE64 secret missing — build.gradle falls back to debug signing"
          fi

      - name: 🔑 Write key.properties
        working-directory: gpstaffapp
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STAFFAPP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STAFFAPP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STAFFAPP_KEY_PASSWORD }}
        run: |
          if [ -f android/app/jsastute-release.keystore ]; then
            cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=jsastute-release.keystore
          EOF
            echo "Release signing enabled ✅"
          else
            rm -f android/key.properties
            echo "No keystore — build.gradle falls back to debug signing"
          fi

      - name: 🏗️ Build release APK
        working-directory: gpstaffapp
        run: flutter build apk --release

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: staffapp-release-apk
          path: staffapp/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 🚀 Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staffapp/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
